<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>QA-Turbo — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#2563EB;--green:#059669;--bg:#F8FAFC;--fg:#0F172A;--card:#fff;--mut:#F1F5FD;--mutfg:#475569;--bd:#E2E8F0;--red:#DC2626;--mono:'Fira Code',monospace;--sans:'Fira Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--fg);line-height:1.5}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{height:56px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 20px}
.top .logo{background:var(--blue);color:#fff;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700}
.wrap{max-width:480px;margin:40px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:24px}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;font:inherit}
input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border:0;border-radius:8px;font-weight:600}
.btn-p{background:var(--blue);color:#fff;width:100%;margin-top:20px}.btn-p:hover{background:#1D4ED8}
.alert{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:8px;padding:12px;margin-top:16px;font-size:14px}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
</style></head><body>
<header class="top"><span class="logo">Q</span><b>QA-Turbo</b><span style="margin-left:auto;font-size:13px;color:var(--mutfg)">Checkout Core v2.4 ▾</span></header>
<div class="wrap"><section class="card">
<h1 style="margin:0;font-size:24px">Welcome back</h1><p style="color:var(--mutfg)">Sign in to continue to Stage 1: BRD Upload.</p>
<label for="email">Email</label><input id="email" type="email" value="admin@qa-turbo.local" required>
<label for="pw">Password</label><input id="pw" type="password" value="••••••••" required>
<div class="row"><label style="margin:0;display:flex;gap:8px;align-items:center"><input type="checkbox" checked style="width:auto"> Remember me</label><a href="#">Forgot password?</a></div>
<div class="alert" role="alert">Invalid email or password. Check and try again.</div>
<button class="btn btn-p">Sign In →</button>
<p style="text-align:center;font-size:14px;color:var(--mutfg);margin-top:16px">No account yet? <a href="#">Create project + admin</a></p>
</section></div></body></html>
